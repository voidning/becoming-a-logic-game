<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f7f7f5">
  <meta name="description" content="一次从空白开始的交互实验。">
  <title>有 · 无 · 变易</title>
  <style>
    :root { color-scheme: light; background: #f7f7f5; }
    * { box-sizing: border-box; }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; overscroll-behavior: none; }
    body { background: #f7f7f5; -webkit-tap-highlight-color: transparent; }
    #field { display: block; position: fixed; inset: 0; width: 100%; height: 100%; margin: 0; padding: 0; border: 0; border-radius: 0; background: transparent; touch-action: none; cursor: default; user-select: none; -webkit-user-select: none; }
    #field:focus { outline: none; }
    #field:focus-visible { outline: 1px solid #777; outline-offset: -9px; }
    canvas { display: block; width: 100%; height: 100%; pointer-events: none; }
    .sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0,0,0,0); white-space: nowrap; border: 0; }
    noscript { position: fixed; inset: 45% 20px auto; text-align: center; color: #333; font: 16px sans-serif; }
  </style>
</head>
<body>
  <button id="field" type="button" aria-label="交互画布。触碰或按空格，让变化发生；再次触碰，继续。按 Escape 从空白重新开始。" aria-describedby="state">
    <canvas id="canvas" aria-hidden="true"></canvas>
  </button>
  <span class="sr-only" id="state" aria-live="polite">空白。</span>
  <noscript>请启用 JavaScript 来体验这个页面。</noscript>
  <script>
  (() => {
    'use strict';
    const surface = document.getElementById('field');
    const canvas = document.getElementById('canvas');
    const context = canvas.getContext('2d', { alpha: false });
    const status = document.getElementById('state');
    const reduced = window.matchMedia('(prefers-reduced-motion: reduce)');
    const WHITE = '#f7f7f5';
    const BLACK = '#171719';
    let width = innerWidth, height = innerHeight;
    let stage = 'blank';
    let held = false;
    let pointerId = null;
    let keyboardHeld = false;
    let point = { x: width / 2, y: height / 2 };
    let origin = { ...point };
    let time = 0, phaseStart = 0, lastTime = null;
    let waves = [], base = false, lastEmission = -Infinity;
    let releaseAt = null;
    let frame = null;
    const ease = t => { t = Math.max(0, Math.min(1, t)); return t * t * (3 - 2 * t); };
    const farthest = (x, y) => Math.hypot(Math.max(x, width-x), Math.max(y, height-y)) + 4;
    function announce(text) {
      surface.dataset.phase = stage;
      status.textContent = text;
    }
    function disk(x, y, radius, dark) {
      if (radius <= 0) return;
      context.beginPath();
      context.arc(x, y, radius, 0, Math.PI * 2);
      context.fillStyle = dark ? BLACK : WHITE;
      context.fill();
    }
    function emit() {
      const previous = waves.length ? waves[waves.length-1].dark : base;
      waves.push({ x: point.x, y: point.y, r: 0, dark: !previous });
      lastEmission = time;
    }
    function wake() {
      if (frame === null && !document.hidden) frame = requestAnimationFrame(tick);
    }
    function down(x, y) {
      if (held) return;
      held = true;
      point = { x: Math.max(0, Math.min(width, x)), y: Math.max(0, Math.min(height, y)) };
      releaseAt = null;
      if (stage === 'blank') {
        origin = { ...point };
        stage = 'being';
        phaseStart = time;
        announce('一个深色的圆出现了。');
      } else if (stage === 'being') {
        stage = 'vanishing';
        phaseStart = time;
        announce('圆从内部消失，回到空白。');
      } else if (stage === 'nothing') {
        stage = 'becoming';
        phaseStart = time;
        emit();
        announce('出现与消失交替展开。按住或移动，改变它们；松开，让变化继续。');
      } else if (stage === 'becoming' && time-lastEmission >= 550) {
        emit();
      }
      wake();
    }
    function up() {
      if (!held) return;
      held = false;
      if (stage === 'becoming') releaseAt = Math.max(time + 450, lastEmission + 850);
      wake();
    }
    function reset() {
      stage = 'blank'; held = false; keyboardHeld = false; pointerId = null;
      waves = []; base = false; releaseAt = null; lastEmission = -Infinity;
      announce('空白。');
      wake();
    }
    function tick(timestamp) {
      frame = null;
      const dt = lastTime === null ? 16 : Math.min(48, Math.max(0, timestamp-lastTime));
      lastTime = timestamp;
      time += dt;
      context.fillStyle = base ? BLACK : WHITE;
      context.fillRect(0, 0, width, height);
      let animate = false;
      if (stage === 'being') {
        const p = ease((time-phaseStart)/(reduced.matches ? 180 : 820));
        disk(origin.x, origin.y, 31*p, true);
        animate = p < 1;
      } else if (stage === 'vanishing') {
        const p = ease((time-phaseStart)/(reduced.matches ? 180 : 1100));
        disk(origin.x, origin.y, 31+8*p, true);
        disk(origin.x, origin.y, 40*p, false);
        if (p >= 1) {
          stage = 'nothing';
          announce('空白。再次触碰，继续。');
        } else animate = true;
      } else if (stage === 'becoming') {
        if (held && time-lastEmission >= (reduced.matches ? 2600 : 1500)) emit();
        if (!held && releaseAt !== null && time >= releaseAt) {
          emit();
          releaseAt = null;
        }
        if (reduced.matches) {
          // Reduced motion uses a slow whole-field dissolve, without travelling boundaries.
          if (waves.length) {
            const wave = waves[0];
            wave.r += dt;
            const p = ease(wave.r/1400);
            const from = base ? 23 : 247;
            const to = wave.dark ? 23 : 247;
            const color = Math.round(from + (to-from)*p);
            context.fillStyle = `rgb(${color},${color},${color})`;
            context.fillRect(0,0,width,height);
            if (p >= 1) { base = wave.dark; waves.shift(); }
          }
        } else {
          const speed = Math.hypot(width,height)/3200;
          for (const wave of waves) {
            wave.r += dt*speed;
            disk(wave.x,wave.y,wave.r,wave.dark);
          }
          // Once a front has crossed every edge, it becomes the ground for later fronts.
          for (let i = waves.length-1; i >= 0; i--) {
            if (waves[i].r >= farthest(waves[i].x,waves[i].y)) {
              base = waves[i].dark;
              waves.splice(0,i+1);
              break;
            }
          }
        }
        animate = held || waves.length > 0 || releaseAt !== null;
      }
      if (animate) wake();
    }
    function resize() {
      const oldW = width, oldH = height;
      width = innerWidth; height = innerHeight;
      const dpr = Math.min(devicePixelRatio || 1, 2);
      canvas.width = Math.round(width*dpr);
      canvas.height = Math.round(height*dpr);
      context.setTransform(dpr,0,0,dpr,0,0);
      origin.x = origin.x/oldW*width; origin.y = origin.y/oldH*height;
      point.x = point.x/oldW*width; point.y = point.y/oldH*height;
      for (const wave of waves) {
        wave.x = wave.x/oldW*width; wave.y = wave.y/oldH*height;
        wave.r *= Math.max(width/oldW,height/oldH);
      }
      wake();
    }
    surface.addEventListener('pointerdown', event => {
      if (!event.isPrimary || event.button !== 0 || pointerId !== null) return;
      event.preventDefault();
      pointerId = event.pointerId;
      surface.setPointerCapture(pointerId);
      down(event.clientX,event.clientY);
    });
    surface.addEventListener('pointermove', event => {
      if (event.pointerId !== pointerId) return;
      point = { x: event.clientX, y: event.clientY };
    });
    function endPointer(event) {
      if (event.pointerId !== pointerId) return;
      pointerId = null;
      up();
    }
    surface.addEventListener('pointerup',endPointer);
    surface.addEventListener('pointercancel',endPointer);
    surface.addEventListener('lostpointercapture',endPointer);
    surface.addEventListener('click', event => {
      // Assistive technology may activate a button without a pointer or keyboard event.
      if (event.detail === 0 && !keyboardHeld && !event.__handled) {
        if (suppressClick) { suppressClick = false; return; }
        down(width/2,height/2); up();
      }
    });
    let suppressClick = false;
    window.addEventListener('keydown', event => {
      if (event.key === 'Escape') { event.preventDefault(); reset(); return; }
      if ((event.key === ' ' || event.key === 'Enter') && !event.repeat) {
        event.preventDefault(); keyboardHeld = true; suppressClick = true;
        down(width/2,height/2);
      }
    });
    window.addEventListener('keyup', event => {
      if (event.key === ' ' || event.key === 'Enter') {
        event.preventDefault(); keyboardHeld = false; up();
        setTimeout(() => { suppressClick = false; },0);
      }
    });
    window.addEventListener('blur', () => { pointerId = null; keyboardHeld = false; up(); });
    document.addEventListener('visibilitychange', () => {
      lastTime = null;
      if (document.hidden) {
        if (frame !== null) cancelAnimationFrame(frame);
        frame = null; pointerId = null; keyboardHeld = false; up();
      } else wake();
    });
    window.addEventListener('resize',resize);
    reduced.addEventListener('change',wake);
    announce('空白。');
    resize();
  })();
  </script>
</body>
</html>
