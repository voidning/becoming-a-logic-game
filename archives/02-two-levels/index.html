<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#f6f6f3">
  <meta name="description" content="两道相连的谜题。每一次发现，成为下一次行动的能力。">
  <title>有 / 无 — 两道谜题</title>
  <style>
    :root{color-scheme:light;--paper:#f6f6f3;--ink:#242427;--muted:#727276;--fine:#d0d0cd;--cell:calc(var(--board)/7);--board:min(calc(100vw - 12px),560px)}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'PingFang SC',sans-serif;-webkit-tap-highlight-color:transparent}
    button{font:inherit;color:inherit;touch-action:manipulation}button:focus-visible{outline:2px solid #707074;outline-offset:5px}button:disabled{cursor:default}
    main{min-height:100svh;display:flex;flex-direction:column;align-items:center;padding: max(24px,env(safe-area-inset-top)) 0 max(24px,env(safe-area-inset-bottom))}
    header{width:100%;max-width:1120px;padding:0 28px;display:flex;justify-content:space-between;align-items:center;height:32px;flex-shrink:0}
    #chapter{font-size:14px;letter-spacing:.16em;color:var(--muted);font-variant-numeric:tabular-nums}.restart{border:0;background:none;padding:8px;cursor:pointer;font-size:14px;color:var(--muted)}
    .play{display:flex;flex:1;flex-direction:column;justify-content:center;align-items:center;padding:22px 0 14px;min-height:360px}
    #objective{font-size:16px;font-weight:400;letter-spacing:.07em;margin:0 0 10px;min-height:25px;color:#5d5d62;text-align:center}
    .dot-word{display:inline-block;width:9px;height:9px;background:var(--ink);border-radius:50%;margin:0 6px 1px}.goal-word{display:inline-block;width:13px;height:13px;border:1px solid var(--ink);border-radius:50%;margin:0 6px -1px}
    #board{width:var(--board);height:calc(var(--cell)*5);position:relative;isolation:isolate;transition:opacity .45s ease,transform .45s ease;user-select:none;-webkit-user-select:none}
    #board.leaving{opacity:0;transform:translateY(-12px)}
    .tile{position:absolute;width:var(--cell);height:var(--cell);left:calc(var(--x)*var(--cell));top:calc(var(--y)*var(--cell));border:0;background:none;padding:0;cursor:pointer;z-index:2}
    .tile .piece{position:absolute;left:19%;right:19%;top:12%;bottom:26%;border-radius:2px;background:var(--ink);transform:scale(.96);transition:transform .2s ease,background .2s ease,opacity .2s ease}
    .tile.bridge .piece{left:0;right:0;top:9%;bottom:auto;height:12%;border-radius:0;transform:scaleX(1)}
    .tile.empty .piece{background:transparent;outline:1px dashed #b5b5b2;outline-offset:-1px;transform:scale(.83)}
    .tile.empty.bridge .piece{height:15%;top:7.5%;transform:scaleX(.83)}
    .tile.wall.empty .piece{opacity:.22}.tile.wall.empty:not(:hover):not(:focus-visible) .piece{outline-color:transparent}
    .tile .mark{position:absolute;inset:0;display:grid;place-content:center;opacity:0;color:var(--ink);font-size:21px;transition:opacity .15s;pointer-events:none}.tile.bridge .mark{transform:translateY(-23%)}
    @media(hover:hover){.tile:hover .piece{transform:scale(1.03)}.tile.bridge:hover .piece{transform:scaleX(.92)}.tile:hover .mark{opacity:.55}.tile.filled.wall:hover .mark{color:var(--paper)}.tile.filled.bridge:hover .mark{color:var(--ink)}}
    .floor{position:absolute;left:calc(var(--x)*var(--cell));top:calc(var(--cell)*4.09);width:var(--cell);height:calc(var(--cell)*.12);background:var(--ink);opacity:.23;z-index:0}
    #actor{position:absolute;left:calc(var(--cell)*.5);top:calc(var(--cell)*3.7);width:calc(var(--cell)*.27);height:calc(var(--cell)*.27);border-radius:50%;background:var(--ink);transform:translate(-50%,-50%);z-index:4;transition:left .55s cubic-bezier(.45,0,.3,1),opacity .4s,transform .4s;pointer-events:none}
    #actor.waiting{animation:breathe 2.4s ease-in-out infinite}
    #actor.arrived{transform:translate(-50%,-50%) scale(.5);opacity:0}
    #goal{position:absolute;left:calc(var(--cell)*6.5);top:calc(var(--cell)*3.7);width:calc(var(--cell)*.48);height:calc(var(--cell)*.48);border:1.5px solid var(--ink);border-radius:50%;transform:translate(-50%,-50%);z-index:3;transition:transform .6s,border-color .6s,background .6s}
    #goal.complete{transform:translate(-50%,-50%) scale(1.3);background:var(--ink)}
    #reward{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;pointer-events:none;opacity:0;transform:translateY(10px);transition:opacity .5s,transform .5s;font-family:'Songti SC','STSong',serif;font-size:48px;font-weight:400;letter-spacing:.1em;padding-bottom:calc(var(--cell)*.6)}
    #reward.show{opacity:1;transform:translateY(0)}
    #feedback{min-height:27px;max-width:90vw;margin:0;text-align:center;font-size:14px;color:var(--muted);line-height:1.8;transition:opacity .2s}
    footer{display:flex;flex-direction:column;align-items:center;gap:14px;min-height:130px;flex-shrink:0}
    .tools{display:flex;gap:18px;align-items:center}.tool{display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 18px;min-width:100px;min-height:49px;border:1px solid transparent;border-radius:28px;background:transparent;cursor:pointer;transition:border-color .3s,opacity .3s,background .3s}
    .tool[aria-pressed=true]{border-color:#c1c1bf;background:#ececea}.tool:disabled{opacity:.27}.symbol{display:block;width:15px;height:15px;border-radius:50%;background:var(--ink)}.symbol.hollow{background:transparent;border:1.5px solid var(--ink)}
    .tool-name{font-family:'Songti SC','STSong',serif;font-size:18px}.tool.new{animation:unlock 1.8s ease-out}
    #supply{display:flex;gap:8px;align-items:center;height:20px;color:var(--muted);font-size:13px}.unit{width:6px;height:6px;background:var(--ink);border-radius:1px}.empty-unit{background:transparent;border:1px solid #bababa}
    #again{display:none;border:1px solid #bfbfbc;background:transparent;border-radius:22px;padding:10px 22px;min-height:44px;cursor:pointer}#again.show{display:block}
    .sr-only{position:absolute;width:1px;height:1px;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap}
    @keyframes breathe{50%{transform:translate(-50%,-50%) scale(.88)}}@keyframes unlock{0%,35%{box-shadow:0 0 0 6px #24242718}100%{box-shadow:0 0 0 20px transparent}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
    @media(max-height:620px){.play{padding-top:10px}footer{min-height:105px}header{height:25px}}
  </style>
</head>
<body>
  <main>
    <header><span id="chapter">01 / 02</span><button class="restart" id="restart" type="button" aria-label="从第一关重新开始">重来</button></header>
    <section class="play" aria-label="解谜区域">
      <h1 id="objective">让<span class="dot-word" aria-label="实心圆"></span>抵达<span class="goal-word" aria-label="空心圆"></span></h1>
      <div id="board" role="group" aria-label="通路中的虚线空位可以操作">
        <div id="terrain"></div><div id="goal" aria-hidden="true"></div><div id="actor" aria-hidden="true"></div><div id="reward" aria-hidden="true"></div>
      </div>
      <p id="feedback" aria-live="polite">点按虚线空位</p>
    </section>
    <footer>
      <div class="tools" role="group" aria-label="已获得的能力">
        <button class="tool" type="button" id="create" aria-label="有：放入一份材料" aria-pressed="true"><span class="symbol" aria-hidden="true"></span><span class="tool-name">有</span></button>
        <button class="tool" type="button" id="erase" aria-label="尚未获得另一种能力" aria-pressed="false" disabled><span class="symbol hollow" aria-hidden="true"></span><span class="tool-name" id="erase-name">?</span></button>
      </div>
      <div id="supply" aria-label="可用材料"></div>
      <button id="again" type="button">再走一遍</button>
    </footer>
    <span id="reader" class="sr-only" aria-live="polite"></span>
  </main>
  <script src="puzzle.js"></script>
  <script>
  (()=>{
    'use strict';
    const game=BeingPuzzle;
    const $=id=>document.getElementById(id);
    let state=game.create(), mode='create', transition=false, moving=false;
    let timer=null, messageTimer=null, generation=0;
    const tiles=new Map();
    function later(fn,ms){const version=generation;return setTimeout(()=>{if(version===generation)fn();},ms);}
    function feedback(text,persist=false){
      clearTimeout(messageTimer);$('feedback').textContent=text;
      if(!persist)messageTimer=later(()=>{$('feedback').textContent='';},2200);
    }
    function stock(){
      $('supply').replaceChildren();
      for(let i=0;i<Math.max(2,state.stock);i++){
        const dot=document.createElement('span');dot.className='unit'+(i>=state.stock?' empty-unit':'');dot.setAttribute('aria-hidden','true');$('supply').append(dot);
      }
      $('supply').setAttribute('aria-label',`可用材料 ${state.stock} 份`);
    }
    function tools(){
      $('erase').disabled=!state.canErase||transition;
      $('create').disabled=transition;
      $('erase-name').textContent=state.canErase?'无':'?';
      $('erase').setAttribute('aria-label',state.canErase?'无：移除并收回一份材料':'尚未获得另一种能力');
      $('create').setAttribute('aria-pressed',String(mode==='create'));
      $('erase').setAttribute('aria-pressed',String(mode==='erase'));
    }
    function render(){
      $('board').dataset.level=String(state.level+1);$('board').dataset.won=String(state.won);
      for(const cell of state.cells){
        const button=tiles.get(game.key(cell.x,cell.y));
        button.className=`tile ${cell.y===4?'bridge':'wall'} ${cell.filled?'filled':'empty'}`;
        button.disabled=transition||state.won;
        button.setAttribute('aria-label',`${cell.y===4?'通路':'障碍'}，第${cell.x+1}列第${cell.y+1}行，${cell.filled?'已有材料':'空位'}`);
        button.querySelector('.mark').textContent=mode==='create'?'+':'−';
      }
      $('actor').style.left=`calc(var(--cell)*${state.player+.5})`;
      $('actor').classList.toggle('waiting',!state.won&&!!game.blocked(state));
      stock();tools();
    }
    function build(){
      tiles.clear();$('terrain').replaceChildren();
      for(let x=0;x<7;x++)if(x!==2&&x!==4){
        const floor=document.createElement('div');floor.className='floor';floor.style.setProperty('--x',x);floor.setAttribute('aria-hidden','true');$('terrain').append(floor);
      }
      for(const cell of state.cells){
        const button=document.createElement('button');button.type='button';button.style.setProperty('--x',cell.x);button.style.setProperty('--y',cell.y);
        button.innerHTML='<span class="piece" aria-hidden="true"></span><span class="mark" aria-hidden="true"></span>';
        button.addEventListener('click',()=>edit(cell.x,cell.y));
        tiles.set(game.key(cell.x,cell.y),button);$('terrain').append(button);
      }
      $('chapter').textContent=state.level===0?'01 / 02':'02 / 02';
      $('goal').classList.remove('complete');$('actor').classList.remove('arrived');$('reward').classList.remove('show');
      render();
    }
    function edit(x,y){
      if(transition||state.won)return;
      const result=game.edit(state,x,y,mode);
      if(!result.changed){
        const messages={stock:'没有可用材料了',occupied:'这里已经有了',empty:'这里已经是空的',support:'它正站在这里',player:'它正经过这里'};
        if(messages[result.reason])feedback(messages[result.reason]);return;
      }
      state=result.state;feedback('');render();advance();
    }
    function advance(){
      if(moving||transition||state.won||document.hidden)return;
      const next=game.step(state);
      if(next===state)return;
      state=next;moving=true;render();
      timer=later(()=>{
        moving=false;
        if(state.won)win();else advance();
      },620);
    }
    function win(){
      $('goal').classList.add('complete');$('actor').classList.add('arrived');
      if(state.level===0){
        transition=true;tools();$('erase').classList.add('new');
        $('reward').textContent='无';$('reward').classList.add('show');feedback('获得新的能力',true);
        $('reader').textContent='第一关完成。获得无，可以移除并收回材料。第二关即将开始。';
        timer=later(()=>{
          $('board').classList.add('leaving');
          timer=later(()=>{
            state=game.create(1);mode='erase';transition=false;build();
            $('board').classList.remove('leaving');
            feedback('试试刚得到的能力',true);advance();
          },480);
        },1900);
      }else{
        feedback('两种能力，都留下了。',true);
        $('reader').textContent='两关完成。你同时拥有有和无。';
        $('again').classList.add('show');
      }
    }
    function choose(next){
      if(transition||state.won||(next==='erase'&&!state.canErase))return;
      mode=next;render();feedback('');
    }
    function restart(){
      generation++;clearTimeout(timer);clearTimeout(messageTimer);moving=false;transition=false;
      state=game.create();mode='create';$('board').classList.remove('leaving');$('again').classList.remove('show');$('erase').classList.remove('new');
      build();feedback('点按虚线空位',true);timer=later(advance,700);
    }
    $('create').addEventListener('click',()=>choose('create'));
    $('erase').addEventListener('click',()=>choose('erase'));
    $('restart').addEventListener('click',restart);$('again').addEventListener('click',restart);
    window.addEventListener('keydown',event=>{
      if(event.key==='Escape'){event.preventDefault();restart();}
      if(event.key==='1')choose('create');if(event.key==='2')choose('erase');
    });
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)advance();});
    restart();
  })();
  </script>
</body>
</html>
